name: Local assistant checks
on:
  push:
    branches: [codex/rubric-mobile-ar-ai-cloud]
    paths: ["Backend/**", "Tools/Start-Assistant.ps1", "Assets/Farm/Resources/FarmTechnology/knowledge.json", ".github/workflows/rubric-backend.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Local backend and launcher tests
        run: |
          python -m pip install -r Backend/requirements.txt
          python Backend/tests/test_services.py
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed' }
          python Backend/tests/test_launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed' }
